[project]
name = "lang-trends"
version = "0.1.0"
description = "Data collection for programming language trends rankings"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]
